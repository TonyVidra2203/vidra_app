name: vidra_app
description: "VidRA SMS & PUSH Forwarder"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/vidra_app_icon.png
    - assets/images/vidra_splash.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/vidra_app_icon.png"
  adaptive_icon_background: "#080808"
  adaptive_icon_foreground: "assets/images/vidra_app_icon.png"
  min_sdk_android: 23

flutter_native_splash:
  color: "#080808"

  android: true
  ios: false
  web: false

  android_12:
    color: "#080808"